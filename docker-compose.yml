version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # REDIS - In-Memory Fast Cache & Pub/Sub Realtime Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pulsepoll-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  # ---------------------------------------------------------------------------
  # MONGODB - Document Persistence & Audit Logs
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: pulsepoll-mongodb
    ports:
      - "27017:27017"
    restart: always
    environment:
      MONGO_INITDB_DATABASE: pulsepoll_db
    volumes:
      - mongo_data:/data/db

  # ---------------------------------------------------------------------------
  # BACKEND - Go (Gin) High-Performance API & WebSocket Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsepoll-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_NAME: pulsepoll_db
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: pulsepoll-production-grade-hmac-sha256-secret-key-9912487
      CLIENT_ORIGIN: http://localhost:5173,http://localhost:3000
      FALLBACK_MODE: "true"
    depends_on:
      - mongodb
      - redis
    restart: always

  # ---------------------------------------------------------------------------
  # FRONTEND - React + Vite Reactive Client UI
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsepoll-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
      VITE_WS_HOST: localhost:8080
    depends_on:
      - backend
    restart: always

volumes:
  redis_data:
  mongo_data:
